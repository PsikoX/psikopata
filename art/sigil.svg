<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Sigilo Psikopata">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="100%" stop-color="#0d0a09"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="50%" stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#b9832b"/>
    </linearGradient>
    <linearGradient id="dual" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a3d91"/>
      <stop offset="50%" stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#007168"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- anel externo: o oceano que liga -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="url(#dual)" stroke-width="2" opacity="0.55"/>
  <circle cx="400" cy="400" r="322" fill="none" stroke="url(#ouro)" stroke-width="0.5" opacity="0.35"/>

  <!-- duas ondas: CV (morna, azul) e MZ (marrabenta, verde) -->
  <path d="M100 430 C180 380 260 480 340 430 S500 380 580 430 S700 480 740 430"
        fill="none" stroke="#0a3d91" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#soft)"/>
  <path d="M100 470 C180 420 260 520 340 470 S500 420 580 470 S700 520 740 470"
        fill="none" stroke="#007168" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#soft)"/>

  <!-- o P monograma: círculo + haste -->
  <circle cx="400" cy="330" r="110" fill="none" stroke="url(#ouro)" stroke-width="20"/>
  <line x1="290" y1="330" x2="290" y2="620" stroke="url(#ouro)" stroke-width="20" stroke-linecap="round"/>

  <!-- a faísca rubra: o instante psicótico -->
  <circle cx="560" cy="230" r="14" fill="#d8323c"/>
  <circle cx="560" cy="230" r="30" fill="none" stroke="#d8323c" stroke-width="1" opacity="0.5"/>
  <circle cx="560" cy="230" r="48" fill="none" stroke="#d8323c" stroke-width="0.5" opacity="0.3"/>

  <!-- grão fino -->
  <rect width="800" height="800" fill="#000" opacity="0"/>
</svg>
